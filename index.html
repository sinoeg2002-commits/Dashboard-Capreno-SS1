/* header */
#emblem{position:absolute;left:14px;top:12px;width:66px;height:48px;border-radius:9px;background:#fff;padding:3px;object-fit:contain}
#title{position:absolute;left:92px;top:12px;font-size:27px;line-height:42px;font-weight:600;color:#fff;white-space:nowrap;letter-spacing:.2px}
#score{position:absolute;left:760px;top:10px;width:238px;height:50px;border:1px solid rgba(255,255,255,.45);border-radius:8px;background:rgba(255,255,255,.1);display:flex;align-items:center;gap:10px;padding:0 10px;color:#fff}
#score .num{font-size:36px;font-weight:700;line-height:1;color:#FFB570}
#score .lbl{font-size:12px;line-height:13px;font-weight:600}
#score .sub{font-size:10px;font-weight:400;color:#C9D8F0;margin-top:2px}
#tabs{position:absolute;z-index:10;left:14px;top:66px;width:262px}
.tab{display:block;width:100%;height:26px;margin:0 0 4px;padding:0 10px;text-align:left;font-size:12.5px;font-weight:600;color:#fff;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.4);border-radius:6px;cursor:pointer}
.tab:hover{background:rgba(255,255,255,.16)}
.tab.on{background:#fff;color:var(--navy);border-color:#fff;border-left:5px solid var(--or)}
.tab:focus-visible,.fbtn:focus-visible,.pill:focus-visible,.pager button:focus-visible,.reset:focus-visible{outline:2px solid #FFB570;outline-offset:1px}
#filters{position:absolute;z-index:10;left:300px;top:62px;width:700px;height:90px;display:grid;grid-template-columns:repeat(5,132px);grid-auto-rows:30px;gap:8px 7px;align-content:start}
.fbtn{position:relative;display:flex;align-items:center;justify-content:space-between;gap:4px;height:30px;padding:0 8px;font-size:11px;font-weight:600;color:var(--navy);background:rgba(255,255,255,.95);border:1px solid #fff;border-radius:6px;cursor:pointer}
.fbtn .fl{flex:1;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn .fc{font-size:8.5px;font-weight:700;color:#fff;background:var(--or);border-radius:8px;padding:1px 5px;line-height:11px}
.fbtn .fc[hidden]{display:none}
.fbtn.act{border-color:var(--or);box-shadow:inset 0 0 0 1px var(--or)}
.fbtn.open{background:#FFF1E4}
.reset{position:absolute;right:0;top:76px;padding:0;background:none;border:0;color:#DCE7F7;font-size:10.5px;text-decoration:underline;cursor:pointer}
.reset:hover{color:#fff}

/* dropdown */
.dd{position:absolute;z-index:60;width:400px;display:flex;gap:10px;padding:10px;background:#fff;border:1px solid #C3CFE0;border-radius:8px;box-shadow:0 10px 28px rgba(4,32,79,.32)}
.dd[hidden]{display:none}
.dd-l{flex:1;min-width:0}
.dd-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px;font-size:11.5px;color:var(--navy)}
.dd-h span a{font-size:10px;color:var(--blue);margin-left:8px;cursor:pointer;text-decoration:underline}
.dd-list{max-height:220px;overflow:auto;border-top:1px solid #E1E7F0}
.opt{display:flex;align-items:center;gap:6px;height:22px;font-size:11.5px;cursor:pointer}
.opt input{margin:0;width:13px;height:13px;accent-color:var(--or)}
.opt .sw{width:9px;height:9px;border-radius:50%;flex:none}
.opt .ol{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opt .on{font-size:10px;color:var(--mut);flex:none}
.dd-r{width:190px;text-align:center;flex:none}
.dd-r .cap{font-size:9px;color:var(--mut);margin-top:2px}

/* panel */
.page{position:absolute;inset:0;pointer-events:none}
.panel{position:absolute;pointer-events:auto;background:#fff;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.panel svg{display:block}
.pt{font-size:12px;font-weight:600;color:var(--navy)}
.mhead{height:50px;padding:5px 8px 0;background:#fff;position:relative;z-index:2}
.pills{display:flex;gap:3px;margin-top:3px}
.pill{padding:1px 6px;font-size:8.5px;font-weight:600;color:#34435C;background:#fff;border:1px solid #C3CFE0;border-radius:9px;cursor:pointer}
.p1mnav{display:flex;align-items:center;gap:8px;padding:0 8px;border-bottom:1px solid var(--line);background:#F7F9FC}
.p1mnav-btn{width:20px;height:20px;flex:0 0 auto;border:1px solid #C3CFE0;background:#fff;border-radius:5px;color:var(--navy);font-size:13px;line-height:1;cursor:pointer;padding:0}
.p1mnav-btn:hover{background:#EEF2F8}
.p1mnav-title{flex:1;font-size:11.5px;font-weight:600;color:var(--navy);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.p1mnav-sub{font-weight:400;color:var(--mut);font-size:9.5px;margin-left:4px}
.p1mdots{display:flex;gap:5px}
.p1mdot{width:6px;height:6px;border-radius:50%;background:#C9D1DE;cursor:pointer;display:inline-block}
.p1mdot.on{background:var(--or)}
.pill.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.mlegend{display:flex;gap:6px;padding:3px 8px 0;font-size:8.5px;line-height:11px;color:#34435C;overflow:hidden;background:#fff;position:relative;z-index:2}
.mlegend .mk{flex:none}
.mapbase{position:absolute;inset:0;background:#EEF2F8}
.mapov{position:absolute;inset:0}
.mapov svg{display:block}
.leaflet-control-attribution{font-size:7px;padding:0 3px;background:rgba(255,255,255,.75)}
.leaflet-bar,.leaflet-control{box-shadow:none}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin:0 3px 0 5px}

/* analisis */
.ana{padding:4px 12px 0}
.ah{display:flex;align-items:center;gap:8px;height:17px;margin-bottom:2px}
.chip{font-size:9px;font-weight:600;color:#B4530A;background:#FFF1E4;border-radius:8px;padding:0 7px;line-height:14px}
.ana ul{margin:0;padding:0;list-style:none;columns:3;column-gap:18px;column-fill:auto;height:85px;font-size:9.8px;line-height:12px;overflow:hidden}
.ana li{break-inside:avoid;position:relative;margin:0 0 3px;padding-left:9px}
.ana li::before{content:"";position:absolute;left:0;top:4px;width:4px;height:4px;border-radius:50%;background:var(--or)}
.ana b{color:var(--navy)}

/* tabel dokumentasi */
.dt{width:100%;table-layout:fixed;border-collapse:collapse;font-size:10.5px}
.dt th{height:24px;padding:0 8px;text-align:left;font-size:11px;font-weight:600;color:#fff;background:var(--navy)}
.dt td{height:160px;padding:6px 8px;vertical-align:top;line-height:1.3;border-bottom:1px solid #E4EAF3}
.dt tr:nth-child(even) td{background:#F8FAFD}
.dt td.pc{padding:6px 8px}
.dt tr.emp td{height:auto;padding:70px 20px;text-align:center;color:#7A879C;font-size:12px}
.mut{color:var(--mut);font-size:9.5px;margin-top:3px}
.pr{display:flex;align-items:center;gap:6px;height:72px;margin-bottom:4px}
.pr:last-child{margin-bottom:0}
.tag{flex:none;width:46px;padding:2px 0;text-align:center;font-size:9px;font-weight:700;color:#fff;border-radius:3px}
.tag.c{background:var(--or)}
.tag.f{background:var(--blue)}
.ph{position:relative;display:flex;align-items:center;justify-content:center;flex:none;width:166px;height:72px;overflow:hidden;background:#EEF2F8;border:1px dashed #B9C5D8;border-radius:4px;text-decoration:none;cursor:zoom-in}
.ph .phi{font-size:9px;line-height:11px;text-align:center;color:#7A879C}
.ph.none{border-style:solid;border-color:#E1E7F0;cursor:default}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0}
.ph img.ok{opacity:1}
a.ph:hover{border-color:var(--or)}
.pm{position:absolute;inset:0;z-index:80;display:flex;align-items:center;justify-content:center;background:rgba(10,26,58,.66)}
.pm[hidden]{display:none}
.pm-box{width:820px;max-width:92%;background:#fff;border-radius:10px;padding:14px 16px 16px;box-shadow:0 20px 50px rgba(0,0,0,.4)}
.pm-h{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.pm-h b{font-size:14px;color:var(--navy)}
.pm-h .mut{flex:1;color:var(--mut);font-size:11px}
.pm-x{flex:none;width:26px;height:26px;padding:0;border:none;background:#EEF2F8;border-radius:5px;cursor:pointer;font-size:13px;color:var(--navy)}
.pm-x:hover{background:#E1E7F0}
.pm-imgs{display:flex;gap:14px}
.pm-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:6px}
.pm-col .tag{width:74px;flex:none}
.pm-img{position:relative;display:flex;align-items:center;justify-content:center;width:100%;height:300px;overflow:hidden;background:#EEF2F8;border:1px solid #E1E7F0;border-radius:6px}
.pm-img img{width:100%;height:100%;object-fit:cover}
.pm-img.none{color:#7A879C;font-size:11px}
.pm-link{font-size:10.5px;color:var(--blue);text-decoration:underline}
.pager{position:absolute;left:0;right:0;bottom:0;height:28px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:10.5px;background:#F8FAFD;border-top:1px solid #E1E7F0}
.pager button{padding:2px 9px;font-size:10.5px;font-weight:600;color:var(--navy);background:#fff;border:1px solid #C3CFE0;border-radius:5px;cursor:pointer}
.pager button:disabled{opacity:.4;cursor:default}
.pager label{display:flex;align-items:center;gap:5px;cursor:pointer}
.pager input{margin:0;accent-color:var(--or)}
.pg{display:flex;align-items:center;gap:8px}

#foot{position:absolute;left:14px;top:673px;font-size:10px;color:#7A5C3A}
#tip{position:absolute;display:none;z-index:70;max-width:270px;padding:5px 8px;font-size:10.5px;line-height:1.35;color:#fff;background:var(--navy);border-radius:5px;pointer-events:none}

/* ============ statistik ============ */
const wlOf = (r, p, t) => { const a = r.sc[p].fp[t], b = r.sc[p].cap[t]; return (a == null || b == null) ? null : b - a; };
const wlAvg = (r, p) => mean([0, 1, 2].map(t => wlOf(r, p, t)));
const pairsOf = (recs, p, t) => recs.filter(r => wlOf(r, p, t) != null);
function statP(recs, p, t) {
  const pr = pairsOf(recs, p, t);
  const wl = pr.map(r => wlOf(r, p, t));
  return {
    n: pr.length, wl: mean(wl),
    fp: mean(pr.map(r => r.sc[p].fp[t])), cap: mean(pr.map(r => r.sc[p].cap[t])),
    win: wl.filter(x => x > 0).length, tie: wl.filter(x => x === 0).length, lose: wl.filter(x => x < 0).length,
  };
}
function counts(recs, p, t, side) {
  const c = [0, 0, 0, 0, 0];
  recs.forEach(r => { const v = r.sc[p][side][t]; if (v != null) c[v]++; });
  return { c, n: c[1] + c[2] + c[3] + c[4] };
}
const uniqSorted = (recs, f) => [...new Set(recs.map(f).map(x => x == null ? NA : x))].sort((a, b) => a.localeCompare(b, 'id'));
function topOf(recs, f) {
  const m = new Map();
  recs.forEach(r => { const k = f(r); m.set(k, (m.get(k) || 0) + 1); });
  return [...m.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0]), 'id'))[0];
}
function prefCounts(recs) {
  const rows = [];
  ['h7', 'h14', 'h21'].forEach((h, i) => {
    let fp = 0, cap = 0;
    recs.forEach(r => { if (r.pref[h] === 'fp') fp++; else if (r.pref[h] === 'cap') cap++; });
    rows.push({ label: T[i], fp, cap, tie: 0 });
  });
  let fp = 0, cap = 0, tie = 0;
  recs.forEach(r => {
    const b = r.blind;
    if (b.fpKeb == null || b.capKeb == null || b.fpPerf == null || b.capPerf == null) return;
    const a = b.fpKeb + b.fpPerf, c = b.capKeb + b.capPerf;
    if (c > a) cap++; else if (a > c) fp++; else tie++;
  });
  rows.push({ label: '40-45 HST*', fp, cap, tie });
  fp = 0; cap = 0;
  recs.forEach(r => { if (r.pref.h60 === 'fp') fp++; else if (r.pref.h60 === 'cap') cap++; });
  rows.push({ label: '60 HST', fp, cap, tie: 0 });
  return rows;
}
function susCounts(recs) {
  const c = { fp: { Iya: 0, Tidak: 0 }, cap: { Iya: 0, Tidak: 0 } };
  recs.forEach(r => ['fp', 'cap'].forEach(s => { const v = r.susulan[s]; if (v === 'Iya' || v === 'Tidak') c[s][v]++; }));
  return c;
}

/* ============ chart 1: matriks butterfly ============ */
function svgOpen(W, H) { return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="inherit">`; }
function emptyMsg(W, H, msg) { return `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" font-size="12" fill="#7A879C">${esc(msg)}</text>`; }

const avgTxt = v => { const t = fmt(v, 2); return t.includes(',') ? t.replace(/0+$/, '').replace(/,$/, '') : t; };
const barSegs = (bx, bw, by, bh, st, fpTxtSz, tipFn) => {
  const fpw = bw * st.fp / (st.fp + st.cap), cpw = bw - fpw;
  let o = `<rect x="${bx.toFixed(2)}" y="${by.toFixed(2)}" width="${fpw.toFixed(2)}" height="${bh.toFixed(2)}" fill="${BLUE}" stroke="#fff" stroke-width=".6" data-tip="${esc(tipFn('fp'))}"/>`;
  o += `<rect x="${(bx + fpw).toFixed(2)}" y="${by.toFixed(2)}" width="${cpw.toFixed(2)}" height="${bh.toFixed(2)}" fill="${ORANGE}" stroke="#fff" stroke-width=".6" data-tip="${esc(tipFn('cap'))}"/>`;
  const ty = by + bh / 2 + fpTxtSz * 0.36;
  if (fpw >= 15 && bh >= 6.5) o += `<text x="${(bx + fpw / 2).toFixed(2)}" y="${ty.toFixed(2)}" font-size="${fpTxtSz.toFixed(1)}" font-weight="600" fill="#fff" text-anchor="middle" pointer-events="none">${avgTxt(st.fp)}</text>`;
  if (cpw >= 15 && bh >= 6.5) o += `<text x="${(bx + fpw + cpw / 2).toFixed(2)}" y="${ty.toFixed(2)}" font-size="${fpTxtSz.toFixed(1)}" font-weight="600" fill="#fff" text-anchor="middle" pointer-events="none">${avgTxt(st.cap)}</text>`;
  return o;
};

function mapGeom(W, H) {

function mapSVG(lmap, W, H) {

    }
    for (let lo = Math.ceil(g.lon0 * 2) / 2; lo <= g.lon1; lo += 0.5) {

function wlSVG(recs, W, H, ri) {

  if (!recs.length) { s += emptyMsg(W, H, 'Tidak ada demo pada filter ini') + '</svg>'; return s; }
  s += `<rect x="8" y="3" width="10" height="10" fill="${ORANGE}"/><text x="21" y="11.5" font-size="8.5" fill="#34435C">Capreno unggul</text>`;

  s += `<text x="${W - 8}" y="11.5" font-size="8" fill="${MUTED}" text-anchor="end">angka = jumlah demo</text>`;

  const items = rd.p === 'crop' ? vars : prods, key = rd.p === 'crop' ? (r => r.var) : (r => r.fp);
  const top = 24, gapX = 10;

      if (!st.n) { s += `<text x="${acx.toFixed(2)}" y="${(cy + 3).toFixed(2)}" font-size="8" fill="#B4BECE" text-anchor="middle">–</text>`; return; }
      const wl = st.wl, len = Math.abs(wl) * sc, bh = Math.max(5, rh - 4), by = cy - bh / 2, bx = wl >= 0 ? acx : acx - len;
      const tip = `${row.it} · ${T[t]} · ${PLABEL[rd.p]}\nSkor FP ${fmt(st.fp)} → Capreno ${fmt(st.cap)}\nWL rata-rata ${fmt(wl, 2, true)} (n = ${st.n} demo)`;
      if (len > 0.6) s += `<rect x="${bx.toFixed(2)}" y="${by.toFixed(2)}" width="${len.toFixed(2)}" height="${bh.toFixed(2)}" fill="${wl > 0 ? ORANGE : BLUE}" data-tip="${esc(tip)}"/>`;

/* ============ analisis data ============ */

}

function analysis1(recs) {

  o.push(`<b>Cakupan.</b> ${n} dari ${DATA.length} demo di ${kabs} kabupaten; pembanding terbanyak ${esc(tf[0])} (${tf[1]}), varietas ${esc(tv[0])} (${tv[1]}).${n < 5 ? ' Demo sedikit, baca sebagai gambaran awal.' : ''}`);

    o.push(`<b>Crop performa.</b> Capreno ${verdict(allc, 'di atas FP', 'setara FP', 'di bawah FP')}: skor ${fmt(l.cap)} vs ${fmt(l.fp)} (${T[ltc]}), kalah di ${l.lose} dari ${l.n} demo.${w}`);

  }
  const tot = recs.map(r => { const v = ps.flatMap(p => [0, 1, 2].map(t => wlOf(r, p, t))).filter(x => x != null); return { id: r.id, v: sum(v), c: v.length }; }).filter(x => x.c).sort((a, b) => b.v - a.v);
  if (tot.length >= 3) o.push(`<b>Demo menonjol.</b> Total WL tertinggi ${tot.slice(0, 2).map(x => `${esc(x.id)} (${fmt(x.v, 0, true)})`).join(', ')}; terendah ${tot.slice(-2).reverse().map(x => `${esc(x.id)} (${fmt(x.v, 0, true)})`).join(', ')}.`);
  const allGreen = recs.filter(r => ps.every(p => (wlAvg(r, p) || 0) > 0)), cropRed = recs.filter(r => (wlAvg(r, 'crop') || 0) < 0 && ((wlAvg(r, 'umum') || 0) > 0 || (wlAvg(r, 'khusus') || 0) > 0));
  o.push(`<b>Peta (rerata 7\u201321 HSA).</b> Tiga sisi hijau: ${allGreen.length} demo. Gulma lebih bersih tetapi sisi tanaman merah: ${cropRed.length} demo${cropRed.length && cropRed.length <= 4 ? ' (' + cropRed.map(r => esc(r.id)).join(', ') + ')' : ''}.`);
  return o;
}
function analysis3(recs, visible, list) {
  if (!recs.length) return ['Tidak ada demo yang cocok dengan filter. Ubah pilihan filter untuk melihat analisis.'];
  const o = [], full = recs.filter(r => photoCount(r) === 6).length;
  o.push(`<b>Kelengkapan foto.</b> ${full} dari ${recs.length} demo terpilih punya foto lengkap 7, 14, dan 21 HSA. Tabel menampilkan ${list.length} demo, ${PER_PAGE} per halaman.`);
  visible.forEach(r => {
    const f = p => [0, 1, 2].map(t => wlOf(r, p, t)).map(v => v == null ? '\u2013' : fmt(v, 0, true)).join('/'), pf = r.pref.h21;
    o.push(`<b>${esc(r.id)}.</b> WL 7/14/21 HSA: umum ${f('umum')}, khusus ${f('khusus')}, tanaman ${f('crop')}.${pf ? ` Petani pilih plot ${pf === 'cap' ? 'Capreno' : 'FP'} (21 HSA).` : ''}${(wlAvg(r, 'crop') || 0) < 0 ? ' Skor tanaman Capreno di bawah FP, cek foto tanaman.' : ''}`);
  });
  const st = ['umum', 'khusus', 'crop'].map(p => statP(list, p, 2));
  if (list.length && st.some(x => x.n)) o.push(`<b>Semua demo di tabel.</b> WL rata-rata 21 HSA: umum ${fmt(st[0].wl, 2, true)}, khusus ${fmt(st[1].wl, 2, true)}, tanaman ${fmt(st[2].wl, 2, true)}.`);
  o.push('<b>Catatan.</b> Dihitung dari skor dan komentar demo yang tampil; foto belum dianalisis secara visual.');
  return o;
}
const anaHTML = (title, bullets, n) => `<div class="ah"><span class="pt">${title}</span><span class="chip">${n} demo terpilih</span></div><ul>${bullets.map(b => `<li>${b}</li>`).join('')}</ul>`;

/* ============ filter UI ============ */
function pieSVG(opts, total, size) {
  const r = size / 2 - 3, cx = size / 2, cy = size / 2;
  let a0 = -Math.PI / 2, out = `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" font-family="inherit">`;
  if (opts.length === 1) out += `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${PIE[0]}"/><text x="${cx}" y="${cy + 4}" font-size="11" font-weight="700" fill="#fff" text-anchor="middle">100%</text>`;
  else opts.forEach((o, i) => {
    const fr = o.n / total, a1 = a0 + fr * 2 * Math.PI, lg = fr > 0.5 ? 1 : 0;
    const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0), x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
    out += `<path d="M${cx} ${cy}L${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${lg} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}Z" fill="${PIE[i % PIE.length]}" stroke="#fff" stroke-width="1.2" data-tip="${esc(`${o.v}\n${o.n} demo (${Math.round(fr * 100)}%)`)}"/>`;
    if (fr >= 0.08) { const am = (a0 + a1) / 2; out += `<text x="${(cx + r * 0.62 * Math.cos(am)).toFixed(1)}" y="${(cy + r * 0.62 * Math.sin(am) + 3).toFixed(1)}" font-size="9" font-weight="700" fill="#fff" text-anchor="middle" pointer-events="none">${Math.round(fr * 100)}%</text>`; }
    a0 = a1;
  });
  return out + '</svg>';
}
function ddHTML(f) {
  const rows = f.opts.map((o, i) => `<label class="opt"><input type="checkbox" data-i="${i}" ${S.sel[f.k].has(o.v) ? 'checked' : ''}><i class="sw" style="background:${PIE[i % PIE.length]}"></i><span class="ol" title="${esc(o.v)}">${esc(o.v)}</span></label>`).join('');
  return `<div class="dd-l"><div class="dd-h"><b>${esc(f.label)}</b><span><a data-a="all">Pilih semua</a><a data-a="none">Kosongkan</a></span></div><div class="dd-list">${rows}</div></div><div class="dd-r">${pieSVG(f.opts, DATA.length, 190)}<div class="cap">Komposisi total, n = ${DATA.length} demo</div></div>`;
}
function buildFilters() {
  $('filters').innerHTML = FILTERS.map(f => `<button class="fbtn" data-k="${f.k}"><span class="fl">${esc(f.short)}</span><span class="fc" hidden></span><svg width="9" height="6" viewBox="0 0 9 6"><path d="M1 1l3.5 3.5L8 1" stroke="currentColor" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg></button>`).join('') + '<button class="reset" id="reset">Atur ulang filter</button>';
}
function updateFilterBtns() {
  FILTERS.forEach(f => {
    const b = document.querySelector(`.fbtn[data-k="${f.k}"]`); if (!b) return;
    const n = S.sel[f.k].size, tot = f.opts.length, act = n < tot;
    b.classList.toggle('act', act); b.classList.toggle('open', S.dd === f.k);
    const c = b.querySelector('.fc'); c.hidden = !act; c.textContent = `${n}/${tot}`;
  });
}
function openDD(k) {
  const dd = $('dd');
  if (S.dd === k) { closeDD(); return; }
  S.dd = k; const f = FILTERS.find(x => x.k === k);
  dd.innerHTML = ddHTML(f); dd.hidden = false;
  const b = document.querySelector(`.fbtn[data-k="${k}"]`);
  dd.style.left = Math.max(6, Math.min(b.offsetLeft + $('filters').offsetLeft, 1264 - 400)) + 'px';
  dd.style.top = ($('filters').offsetTop + b.offsetTop + b.offsetHeight + 4) + 'px';
  updateFilterBtns();
}
function closeDD() { S.dd = null; const dd = $('dd'); dd.hidden = true; updateFilterBtns(); }

/* ============ render ============ */
function renderMaps() {
  if (S.page === 1) updateMapPanel('p1map', 270, 380, 50);
  if (S.page === 2) updateMapPanel('p2map', 322, 380, 34);
}
function render() {
  const recs = filtered();
  $('scoreN').textContent = DATA.length;
  $('scoreSub').textContent = recs.length === DATA.length ? 'Semua demo tampil' : `Terpilih filter: ${recs.length} demo`;
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('on', +t.dataset.p === S.page));
  ['p1', 'p2', 'p3'].forEach(id => { $(id).style.display = id === 'p' + S.page ? 'block' : 'none'; });
  updateFilterBtns();
  if (S.page === 1) {
    $('p1m').innerHTML = matrixPanelHTML(recs, 712, 380);
    $('p1pref').innerHTML = prefSVG(recs, 254, 212);
    $('p1sus').innerHTML = susSVG(recs, 254, 162);
    $('p1ana').innerHTML = anaHTML('Analisis data', analysis1(recs), recs.length);
  } else if (S.page === 2) {
    $('p2wl').innerHTML = wlPanelHTML(recs, 552, 380);
    $('p2heat').innerHTML = heatSVG(recs, 362, 380);
    $('p2ana').innerHTML = anaHTML('Analisis data', analysis2(recs), recs.length);
  } else {
    const r = p3HTML(recs);
    $('p3t').innerHTML = r.html;
    $('p3ana').innerHTML = anaHTML('Analisis data', analysis3(recs, r.visible, r.list), recs.length);
  }
  renderMaps();
}

/* ============ init & events ============ */
function fit() {
  const vp = $('vp'), st = $('stage');
  const w = vp.clientWidth, h = vp.clientHeight, k = Math.min(w / 1264, h / 706);
  st.style.transform = `translate(${(w - 1264 * k) / 2}px,${(h - 706 * k) / 2}px) scale(${k})`;
  S.k = k;
}
function init() {
  const st = $('stage'), tip = $('tip');
  // foto: tampil hanya jika berhasil dimuat; jika diblokir/gagal, placeholder tetap ada
  st.addEventListener('load', e => { if (e.target.tagName === 'IMG' && e.target.closest('.ph')) e.target.classList.add('ok'); }, true);
  st.addEventListener('error', e => { if (e.target.tagName === 'IMG' && e.target.closest('.ph')) e.target.remove(); }, true);
  buildFilters(); fit(); render();
  window.addEventListener('resize', fit);
  st.addEventListener('mousemove', e => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (!el) { tip.style.display = 'none'; return; }
    tip.innerHTML = esc(el.getAttribute('data-tip')).replace(/\n/g, '<br>'); tip.style.display = 'block';
    const r = st.getBoundingClientRect(), k = S.k || 1;
    let x = (e.clientX - r.left) / k + 12, y = (e.clientY - r.top) / k + 12;
    if (x + tip.offsetWidth > 1258) x -= tip.offsetWidth + 24;
    if (y + tip.offsetHeight > 660) y -= tip.offsetHeight + 24;
    tip.style.left = x + 'px'; tip.style.top = y + 'px';
  });
  st.addEventListener('mouseleave', () => { tip.style.display = 'none'; });
  st.addEventListener('click', e => {
    const t = e.target;
    const ph = t.closest('.ph[data-rid]'); if (ph) { e.preventDefault(); openPM(ph.dataset.rid, ph.dataset.h); return; }
    if (t.closest('.pm-x')) { closePM(); return; }
    if (t.id === 'pm') { closePM(); return; }
    const tab = t.closest('.tab'); if (tab) { S.page = +tab.dataset.p; closeDD(); render(); return; }
    const fb = t.closest('.fbtn'); if (fb) { openDD(fb.dataset.k); return; }
    if (t.closest('#reset')) { FILTERS.forEach(f => { S.sel[f.k] = new Set(f.opts.map(o => o.v)); }); S.p3 = 0; if (S.dd) { const f = FILTERS.find(x => x.k === S.dd); $('dd').innerHTML = ddHTML(f); } render(); return; }
    const bm = t.closest('[data-bm]'); if (bm) { S.basemap = bm.dataset.bm; Object.keys(LMAPS).forEach(k => setBasemapLayer(LMAPS[k], S.basemap)); renderMaps(); return; }
    const pill = t.closest('.pill'); if (pill) { S.mapT = pill.dataset.map; renderMaps(); return; }
    const p1mBtn = t.closest('[data-p1m]'); if (p1mBtn) { S.p1m = (S.p1m + (+p1mBtn.dataset.p1m) + MATRIX_VIEWS.length) % MATRIX_VIEWS.length; render(); return; }
    const p1mDot = t.closest('[data-p1mgo]'); if (p1mDot) { S.p1m = +p1mDot.dataset.p1mgo; render(); return; }
    const p2wlBtn = t.closest('[data-p2wl]'); if (p2wlBtn) { S.p2wl = (S.p2wl + (+p2wlBtn.dataset.p2wl) + MATRIX_VIEWS.length) % MATRIX_VIEWS.length; render(); return; }
    const p2wlDot = t.closest('[data-p2wlgo]'); if (p2wlDot) { S.p2wl = +p2wlDot.dataset.p2wlgo; render(); return; }
    const pg = t.closest('[data-pg]'); if (pg && !pg.disabled) { S.p3 += +pg.dataset.pg; render(); return; }
    const a = t.closest('.dd [data-a]');
    if (a) { const f = FILTERS.find(x => x.k === S.dd); S.sel[f.k] = a.dataset.a === 'all' ? new Set(f.opts.map(o => o.v)) : new Set(); $('dd').querySelectorAll('input[type=checkbox]').forEach(cb => { cb.checked = a.dataset.a === 'all'; }); S.p3 = 0; render(); return; }
    if (!t.closest('#dd')) closeDD();
  });
  st.addEventListener('change', e => {
    const t = e.target;
    if (t.id === 'onlyFull') { S.onlyFull = t.checked; S.p3 = 0; render(); return; }
    if (t.closest && t.closest('#dd') && t.dataset.i != null) {
      const f = FILTERS.find(x => x.k === S.dd), v = f.opts[+t.dataset.i].v;
      if (t.checked) S.sel[f.k].add(v); else S.sel[f.k].delete(v);
      S.p3 = 0; render();
    }
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeDD(); closePM(); } });
}
if (typeof document !== 'undefined' && document.getElementById('stage')) init();

</script>
